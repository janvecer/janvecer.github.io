project:
  type: website
  output-dir: docs
  post-render: scripts/finalize-html.ts
  resources:
    - CNAME
    - .nojekyll
    - assets/
    - likelihood/*.js
    - likelihood/*.css
  render:
    - "*.qmd"
    - "likelihood/*.qmd"
    - "research/*.qmd"
    - "!likelihood/_*.qmd"

website:
  title: Jan Vecer
  site-url: https://janvecer.com
  description: "Prices as Information. An information-theoretic perspective on pricing, portfolio choice, hedging, and learning, by Jan Vecer."
  favicon: assets/favicon.svg
  navbar:
    background: light
    foreground: dark
    pinned: true
    collapse-below: lg
    title: Jan Vecer
    left:
      - href: index.qmd
        text: Home
      - href: likelihood/index.qmd
        text: Information Theory & Finance
      - href: resources.qmd
        text: Resources
      - href: jan-vecer.qmd
        text: Jan Vecer
  sidebar:
    - id: likelihood
      title: Information Theory & Finance
      style: floating
      search: false
      collapse-level: 1
      contents:
        - section: Start here
          href: likelihood/index.qmd
          contents:
            - href: likelihood/index.qmd
              text: The framework
            - href: likelihood/relative-entropy.qmd
              text: Relative entropy
        - section: Portfolio choice
          href: likelihood/markets-portfolios.qmd
          contents:
            - href: likelihood/markets-portfolios.qmd
              text: Beliefs and attainable portfolios
            - href: likelihood/trinomial.qmd
              text: Incomplete markets
            - href: likelihood/utility.qmd
              text: Utility & fractional Kelly
            - href: likelihood/mean-variance.qmd
              text: Mean–variance & information
            - href: likelihood/portfolio-lab.qmd
              text: Portfolio laboratory
        - section: Pricing and hedging
          href: likelihood/pricing-hedging.qmd
          contents:
            - href: likelihood/pricing-hedging.qmd
              text: Replication and approximation
            - href: likelihood/options.qmd
              text: Options as distributions
            - href: likelihood/hedging-comparison.qmd
              text: Three hedging criteria
            - href: likelihood/hedging.qmd
              text: Discrete hedging laboratory
        - section: Linear information flows
          href: likelihood/linear-information.qmd
          contents:
            - href: likelihood/linear-information.qmd
              text: Overview and model catalogue
            - href: likelihood/binomial.qmd
              text: Binomial
            - href: likelihood/negative-binomial.qmd
              text: Negative binomial
            - href: likelihood/normal.qmd
              text: Normal / GBM
            - href: likelihood/poisson.qmd
              text: Poisson
            - href: likelihood/gamma.qmd
              text: Gamma
            - href: likelihood/inverse-gaussian.qmd
              text: Inverse Gaussian
        - section: Dynamics and learning
          href: likelihood/dynamics-learning.qmd
          contents:
            - href: likelihood/dynamics-learning.qmd
              text: Information through time
            - href: likelihood/dynamics.qmd
              text: Two ways to build a market
            - href: likelihood/bayesian-learning.qmd
              text: Bayesian learning & commitment
        - section: Research and resources
          href: resources.qmd
          contents:
            - href: resources.qmd
              text: Talks and reading routes
            - href: research/relative-entropy-tests.qmd
              text: Market-efficiency tests · QF
            - href: index.qmd#books
              text: Books
            - href: index.qmd#papers
              text: Selected research
  page-footer:
    left: "© Jan Vecer · Prices as Information"
    right:
      - href: likelihood/index.qmd
        text: Explore the framework
      - href: jan-vecer.qmd
        text: About & contact
  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      - cosmo
      - offline-theme.scss
    css:
      - /styles.css
      - /likelihood/lr-widgets.css
    toc: true
    toc-title: On this page
    toc-depth: 2
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    html-math-method:
      method: mathjax
      url: /assets/vendor/mathjax/tex-chtml-full.js
    code-copy: true
    grid:
      sidebar-width: 245px
      body-width: 790px
      margin-width: 245px
      gutter-width: 1.5rem

lang: en
